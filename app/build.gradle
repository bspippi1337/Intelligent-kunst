plugins { id 'com.android.application' }

android {
    namespace 'no.blckswan.intelligentkunst'
    compileSdk 35

    defaultConfig {
        applicationId 'no.blckswan.intelligentkunst'
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName '0.5.0'
    }
    buildTypes {
        debug {
            // CI debug signatures may rotate. Make test builds install alongside
            // the existing app rather than asking users to uninstall their gallery.
            applicationIdSuffix '.lab'
            versionNameSuffix '-lab'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
